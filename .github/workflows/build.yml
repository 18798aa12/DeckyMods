name: Verify and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt -r requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test && pnpm build && pnpm audit
      - run: python -m pytest --cov=decky_mods
      - run: ruff check main.py py_modules scripts tests && ruff format --check main.py py_modules scripts tests
      - run: python -m scripts.package
      - run: python -m scripts.verify_release release/DeckyMods-v0.3.0.zip
      - name: Packaged Linux smoke without root
        run: |
          unzip -q release/DeckyMods-v0.3.0.zip -d /tmp/deckymods-artifact
          python scripts/linux_smoke.py /tmp/deckymods-artifact/DeckyMods
      - uses: actions/upload-artifact@v4
        with:
          name: DeckyMods-install-and-source
          path: release/*
